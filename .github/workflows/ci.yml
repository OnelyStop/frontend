name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Full history: the diff-based steps below resolve the PR base sha, and
      # the default shallow clone does not contain it -- git exits 128.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: PR closes an issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          n=$(gh pr view "$PR" --json closingIssuesReferences \
                --jq '[.closingIssuesReferences[].number] | length')
          if [ "${n:-0}" -gt 0 ]; then
            echo "OK - closes $n issue(s)"
            exit 0
          fi
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx 'no-issue'; then
            echo "OK - labelled no-issue"
            exit 0
          fi
          echo "::error::this PR closes no issue — open one with the Gate 1 output, then add 'Closes #N' to the body"
          echo "Give each issue its own keyword: 'Closes #12, closes #13'."
          echo "'Closes #12, #13' closes only the first, silently."
          echo
          echo "GitHub registers a closing reference only when the base is the"
          echo "default branch, so a PR stacked on another shows none. Retarget"
          echo "to main, or label it no-issue if it is a typo, a revert, or a"
          echo "fix for something already broken on main."
          exit 1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Types
        run: bunx tsc --noEmit

      - name: Formatting
        run: bun run format:check

      - name: Every file sits in the folder that owns it
        run: bun run check:layout

      # A suite that runs nothing reports green, so the count is checked too.
      # The ANSI strip is load-bearing: vitest colours the summary here but not
      # through a local pipe, so a pattern that works on a laptop reads
      # "Tests \e[22m \e[1m\e[32m68 passed" in CI and matches nothing.
      - name: Tests
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/vitest.log
          sed -E $'s/\x1b\\[[0-9;]*m//g' /tmp/vitest.log \
            | grep -qE 'Tests +[1-9][0-9]* passed' || {
            echo "::error::vitest reported no passing tests — the suite ran nothing"
            exit 1
          }

      # One script, shared with .husky/pre-commit, so the two cannot drift.
      - name: Source guards
        run: bun run check:source

      # Advisories are found by GitHub's Dependabot too, but only after a
      # merge. This is the same information before one.
      - name: Dependencies
        run: bun run check:deps

      # tsc type-checks; it does not build. A bad import or a server/client
      # boundary violation passes types and breaks on deploy.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: bun run build

      # Asks drizzle, rather than comparing which files a PR touched — the
      # filename version failed on a PR that only reformatted schema.ts.
      # generate never connects, so the URL only has to parse.
      - name: Schema and migrations agree
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: |
          before="$(ls src/migrations/*.sql | wc -l)"
          bun run db:generate
          after="$(ls src/migrations/*.sql | wc -l)"
          if [ "$after" -ne "$before" ] || ! git diff --quiet -- src/migrations; then
            echo "::error::schema.ts has changes the migrations do not carry — run bun run db:generate and commit the result"
            git status --short -- src/migrations
            exit 1
          fi
          echo "OK - schema and migrations agree"

      # Git conflicts on identical paths, so 0003_study.sql and
      # 0003_question_bank.sql merge cleanly and both claim 0003. The test suite
      # catches that afterwards; this catches it while it is still one rename.
      - name: Migration numbers are not already taken
        if: github.event_name == 'pull_request'
        run: |
          # The base as it is NOW, not the merge base: a number that was free
          # when the branch was cut is exactly the one that gets taken from
          # under it. No --depth here — a shallow fetch into a full clone
          # writes .git/shallow and breaks the three-dot diffs that follow.
          git fetch --no-tags origin '${{ github.event.pull_request.base.ref }}'
          taken="$(git ls-tree FETCH_HEAD src/migrations/ --name-only \
                    | grep -E '/[0-9]+_.*\.sql$' | xargs -r -n1 basename)"
          fail=0
          # The pathspec also matches rollback/, whose files share these names.
          for f in $(git diff --name-only --diff-filter=A FETCH_HEAD...HEAD -- 'src/migrations/*.sql'); do
            case "$f" in src/migrations/rollback/*) continue ;; esac
            name="$(basename "$f")"
            num="${name%%_*}"
            clash="$(printf '%s\n' "$taken" | grep -E "^${num}_" || true)"
            if [ -n "$clash" ] && [ "$clash" != "$name" ]; then
              echo "::error file=$f::migration $num is already taken on $clash — renumber this one"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK - no migration number collides with the base"

      - name: No large files added
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          [ -n "$base" ] || base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fail=0
          for f in $(git diff --name-only --diff-filter=A "$base"...HEAD); do
            [ -f "$f" ] || continue
            mb=$(( $(wc -c < "$f") / 1024 / 1024 ))
            if [ "$mb" -gt 10 ]; then
              echo "::error file=$f::${mb} MB exceeds the 10 MB limit"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK - no large additions"
          exit $fail
