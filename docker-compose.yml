# Local-dev Postgres for the study module. Production runs against the managed
# (Supabase) database; this exists so `bun run db:migrate` and the content
# importer have a real Postgres to talk to without a network round trip.
#
#   docker compose up -d db
#   # then set DATABASE_URL / DIRECT_URL in .env.local to the postgres:// URL for
#   #   host 127.0.0.1, port 5544, db onelystop, user postgres, password postgres
#   bun run db:migrate
#
# Host port is 5544, not 5432, so it does not collide with a Postgres already
# installed on the machine. init.sql is only applied to a fresh volume — after
# editing it, run `docker compose down -v`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onelystop
    ports:
      - "5544:5432"
    volumes:
      - study_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onelystop"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  study_pg_data:
